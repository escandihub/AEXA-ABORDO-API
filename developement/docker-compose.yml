# version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php81_dev
    volumes:
      - ../:/var/www/html:cached
    working_dir: /var/www/html
    ports:
      - "8000:8000" # PHP built-in server
    command: php -S 0.0.0.0:8000 -t public
    environment:
      PHP_IDE_CONFIG: serverName=localhost
    tty: true
